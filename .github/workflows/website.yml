name: 'website'
on:
  workflow_call:

jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          project: website
      - name: Lint
        uses: ./.github/actions/lint
        with:
          project: website
      - name: Build
        uses: ./.github/actions/builds
        with:
          project: website

      #  cd:
      #    name: 'CD'
      #    needs: ci
      #    runs-on: ubuntu-latest
      #    steps:
      #      - name: Checkout
      #        uses: actions/checkout@v4
      - name: Deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          project: website
