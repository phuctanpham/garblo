name: Main Workflow

on:
  push:
    branches:
      - '**'

jobs:
  trigger-website-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Branch
        id: detect-branch
        uses: ./.github/actions/detect-branch

      - name: Detect Directory Changes
        id: detect-directory-changes
        uses: ./.github/actions/detect-directory
        with:
          directory: 'frontend/website'
          before_sha: ${{ github.event.before }}
          after_sha: ${{ github.sha }}

      - name: Trigger frontend-website workflow
        if: steps.detect-directory-changes.outputs.changed == 'true'
        uses: ./.github/workflows/frontend-website.yml
        with:
          branch: ${{ steps.detect-branch.outputs.branch }}
          sha: ${{ github.sha }}
