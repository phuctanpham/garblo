name: 'main'
on:
  push:
    branches:
      - '**'

jobs:
  detect-changes:
    name: 'Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      mvp: ${{ steps.filter.outputs.mvp }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/api/**'
            mvp:
              - 'frontend/mvp/**'
            website:
              - 'frontend/website/**'

  api:
    name: 'api'
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    uses: ./.github/workflows/api.yml
    secrets: inherit

  mvp:
    name: 'mvp'
    needs: detect-changes
    if: needs.detect-changes.outputs.mvp == 'true'
    uses: ./.github/workflows/mvp.yml
    secrets: inherit

  website:
    name: 'website'
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    uses: ./.github/workflows/website.yml
    secrets: inherit
