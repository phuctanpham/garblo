name: CI

on:
  push:
    branches:
      - '**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect website directory changes
        id: detect-directory
        uses: ./.github/actions/detect-directory
        with:
          path: frontend/website

      - name: Trigger website workflow
        if: steps.detect-directory.outputs.changed == 'true'
        uses: ./.github/workflows/frontend-website.yml
        with:
          branch: ${{ github.ref_name }}
          sha: ${{ github.sha }}
