name: 'api'
on:
  workflow_call:

jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI
        if: github.ref_name != 'main' && !startsWith(github.ref_name, 'release') && !startsWith(github.ref_name, 'test')
        run: echo "skip ci"
      - name: Checkout
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'release') || startsWith(github.ref_name, 'test')
        uses: actions/checkout@v4
      - name: Install dependencies
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'release') || startsWith(github.ref_name, 'test')
        uses: ./.github/actions/install
        with:
          project: api
      - name: Lint
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'release') || startsWith(github.ref_name, 'test')
        uses: ./.github/actions/lint
        with:
          project: api

  cd:
    name: 'CD'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          project: api
      - name: Create .env file
        run: echo "${{ secrets.API_ENV }}" >> backend/api/.env
      - name: Build
        uses: ./.github/actions/builds
        with:
          project: api
      - name: Deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          project: api
          working-directory: ./backend
          command: deploy
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
