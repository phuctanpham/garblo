name: 'Deploy to Cloudflare'
description: 'Deploy the project to Cloudflare'
inputs:
  project:
    description: 'The project to deploy'
    required: true
  cloudflare-api-token:
    description: 'Cloudflare API token'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Deploy
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: export CLOUDFLARE_API_TOKEN="${{ inputs.cloudflare-api-token }}" && export CLOUDFLARE_ACCOUNT_ID="${{ inputs.cloudflare-account-id }}" && pnpm launch --filter ${{ inputs.project }}
    - name: Preview
      if: github.ref != 'refs/heads/main'
      shell: bash
      run: export CLOUDFLARE_API_TOKEN="${{ inputs.cloudflare-api-token }}" && export CLOUDFLARE_ACCOUNT_ID="${{ inputs.cloudflare-account-id }}" && export BRANCH="${{ github.head_ref }}" && pnpm launch --filter ${{ inputs.project }}
