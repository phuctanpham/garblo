name: 'Deploy to Cloudflare'
description: 'Deploy the project to Cloudflare'
inputs:
  project:
    description: 'The project to deploy'
    required: true
  working-directory:
    description: 'Working directory for the project'
    required: true
  command:
    description: 'Wrangler command to run'
    required: true
  cloudflare-api-token:
    description: 'Cloudflare API token'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Debug credentials and directories
      shell: bash
      run: |
        TOKEN="${{ inputs.cloudflare-api-token }}"
        ACCOUNT="${{ inputs.cloudflare-account-id }}"

        echo "=== Directory Information ==="
        echo "Current directory: $(pwd)"
        echo "Working directory: ${{ inputs.working-directory }}/${{ inputs.project }}"

        echo ""
        echo "=== API Token Check ==="
        if [ -z "$TOKEN" ]; then
          echo "❌ Cannot get GitHub secret CLOUDFLARE_API_TOKEN"
        else
          echo "API Token length: ${#TOKEN}"
          echo "API Token last 4: ${TOKEN: -4}"
          if [ "${TOKEN: -4}" = "yQ_C" ]; then
            echo "✅ API Token last 4 equals 'yQ_C': YES"
          else
            echo "❌ API Token last 4 equals 'yQ_C': NO"
          fi
        fi

        echo ""
        echo "=== Account ID Check ==="
        if [ -z "$ACCOUNT" ]; then
          echo "❌ Cannot get GitHub secret CLOUDFLARE_ACCOUNT_ID"
        else
          echo "Account ID length: ${#ACCOUNT}"
          echo "Account ID last 4: ${ACCOUNT: -4}"
          if [ "${ACCOUNT: -4}" = "e01b" ]; then
            echo "✅ Account ID last 4 equals 'e01b': YES"
          else
            echo "❌ Account ID last 4 equals 'e01b': NO"
          fi
        fi

    - name: Deploy to Cloudflare
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}/${{ inputs.project }}
        command: ${{ inputs.command }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
