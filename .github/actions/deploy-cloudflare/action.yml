name: 'Deploy to Cloudflare'
description: 'Deploy the project to Cloudflare'
inputs:
  project:
    description: 'The project to deploy'
    required: true
  working-directory:
    description: 'Working directory for the project'
    required: true
  cloudflare-api-token:
    description: 'Cloudflare API token'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: true
  command:
    description: 'Wrangler command to run'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Deploy to Cloudflare
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}/${{ inputs.project }}
        command: ${{ inputs.command }}
      env:
        BRANCH: ${{ github.head_ref }}
