name: 'Setup Node'
description: 'Set up Node.js and cache pnpm dependencies'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: clean
      run: pnpm clean

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
