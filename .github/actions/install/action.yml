name: 'Install Dependencies'
description: 'Install pnpm and project dependencies for a specific project'
inputs:
  project:
    description: 'The project to install dependencies for'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Clean & Clear
      shell: bash
      run: rm -rf node_modules packages/*/node_modules frontend/*/node_modules packages/*/dist frontend/*/.next frontend/*/build
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install --filter ${{ inputs.project }} --no-frozen-lockfile
