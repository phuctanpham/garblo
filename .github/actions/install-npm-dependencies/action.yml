name: 'Install NPM Dependencies'
description: 'Installs npm dependencies using npm ci'
inputs:
  working-directory:
    description: 'The directory to run npm ci in'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
