server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + uploads to backend
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }
}
